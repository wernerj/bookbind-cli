<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ignored Document Title</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    figure { text-align: center; }
  </style>
  <script>document.write("dropped");</script>
</head>
<body>
  <h1 id="html-chapter" class="chapter-title">HTML Chapter</h1>
  <p>Paragraph before the picture.</p>
  <figure>
    <img src="images/pixel.png" alt="A single pixel">
    <figcaption>A local image</figcaption>
  </figure>
  <div class="note">A styled note.</div>
  <h2>Section</h2>
  <p>More text.</p>
</body>
</html>
